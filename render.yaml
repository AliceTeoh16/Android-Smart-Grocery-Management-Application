# Render Free + Turso Free. No paid disk or paid compute is configured.
services:
  - type: web
    name: shelfwise-free-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev && npm --prefix sharing ci --omit=dev
    startCommand: node deploy/start.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: SHARING_STORAGE
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Import existing household data before turning this off.
      - key: SHARING_IMPORT_MODE
        value: "true"
