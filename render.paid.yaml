# Paid hosting and persistent storage. Review the quoted cost in Render before deploying.
services:
  - type: web
    name: shelfwise-backend
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci --omit=dev && npm --prefix sharing ci --omit=dev
    startCommand: node deploy/start.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: SHARING_DATA_DIR
        value: /var/data/households
      - key: SHARING_STORAGE
        value: sqlite
      - key: APK_PATH
        value: /var/data/downloads/ShelfWise.apk
      # Start safely in import mode so existing accounts can be copied before the DB is opened.
      - key: SHARING_IMPORT_MODE
        value: "true"
    disk:
      name: shelfwise-data
      mountPath: /var/data
      sizeGB: 1
